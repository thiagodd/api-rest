openapi: 3.1.0
info:
  contact:
    name: Equipe de plataforma do Bazar
    url: https://api.bazar.example/suporte
  description: Erros seguem o RFC 9457 (`application/problem+json`). O catálogo de
    tipos de erro está em https://api.bazar.example/problemas.
  license:
    name: Proprietária
    url: https://api.bazar.example/termos
  summary: "Catálogo, clientes e pedidos do marketplace Bazar."
  title: API do Bazar
  version: 1.0.0
servers:
- description: Este servidor
  url: /
- description: Produção
  url: https://api.bazar.example
tags:
- description: O catálogo de produtos
  name: produtos
- description: O estoque dos produtos
  name: estoque
- description: As categorias do catálogo
  name: categorias
- description: Os pedidos
  name: pedidos
- description: Os clientes
  name: clientes
paths:
  /v1/ajustes-estoque/lotes:
    post:
      operationId: ajustarEstoqueEmLote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjusteDeEstoqueEmLoteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoDoLote"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      summary: Define o estoque de vários produtos
      tags:
      - estoque
  /v1/categorias:
    get:
      operationId: listarCategoria
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 60
          minLength: 2
      - in: query
        name: apenasRaizes
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1
      - in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
    post:
      operationId: criarCategoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
  /v1/categorias/{id}:
    delete:
      operationId: removerCategoria
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
    get:
      operationId: detalharCategoria
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
    put:
      operationId: substituirCategoria
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
  /v1/clientes:
    post:
      operationId: cadastrarCliente
      parameters:
      - description: "O canal do cliente. Ausente ou desconhecido, vale `DESCONHECIDO`\
          \ (09.02)."
        in: header
        name: Bazar-Canal
        schema:
          type: string
          examples:
          - WEB
          - APP
          - PARCEIRO
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarClienteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
          description: O cliente foi cadastrado
          headers:
            Location:
              description: A URI do cliente
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Cadastra um cliente
      tags:
      - clientes
  /v1/clientes/{clienteId}/enderecos:
    get:
      operationId: listarEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaEnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
    post:
      operationId: adicionarEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
  /v1/clientes/{clienteId}/enderecos/{enderecoId}:
    delete:
      operationId: removerEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: enderecoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
    get:
      operationId: detalharEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: enderecoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
    put:
      operationId: substituirEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: enderecoId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
  /v1/clientes/{id}:
    get:
      operationId: detalharCliente
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
  /v1/pedidos:
    get:
      operationId: listarPedido
      parameters:
      - in: query
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Itens por página. Acima de 100, vale 100."
        in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          default: 20
          description: "Itens por página. Acima de 100, vale 100."
          minimum: 1
      - description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
        in: query
        name: cursor
        required: false
        schema:
          type:
          - string
          - "null"
          description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaPedidoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - pedidos
    post:
      description: "Um cliente ou produto inexistente dá `422`; estoque insuficiente,\
        \ `409` (10.03)."
      operationId: criarPedido
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarPedidoRequest"
        required: true
      responses:
        "201":
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
          description: O pedido foi criado
          headers:
            Location:
              description: A URI do pedido
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "409":
          $ref: "#/components/responses/Conflito"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Cria um pedido e reserva o estoque
      tags:
      - pedidos
  /v1/pedidos/{id}:
    get:
      operationId: detalharPedido
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - pedidos
  /v1/pedidos/{id}/cancelamento:
    post:
      operationId: cancelarPedido
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelarPedidoRequest"
        required: true
      responses:
        "200":
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      summary: Cancela um pedido
      tags:
      - pedidos
  /v1/produtos:
    get:
      description: "Os filtros se combinam com E; os valores de um mesmo filtro, com\
        \ OU (13.01)."
      operationId: listarProdutos
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 2
      - in: query
        name: sku
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "[A-Z]{3}-\\d{4}"
      - in: query
        name: categoriaId
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
            format: uuid
          maxItems: 20
          minItems: 0
      - in: query
        name: status
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
            description: "Lista extensível: valores novos podem ser acrescentados,\
              \ e o cliente deve tolerar um valor que não conhece (15.04)."
            examples:
            - RASCUNHO
            - ATIVO
            - DESCONTINUADO
      - in: query
        name: precoMin
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - in: query
        name: precoMax
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - in: query
        name: criadoApos
        required: false
        schema:
          type:
          - string
          - "null"
          format: date-time
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      - description: "Itens por página. Acima de 100, vale 100."
        in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          default: 20
          description: "Itens por página. Acima de 100, vale 100."
          minimum: 1
      - description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
        in: query
        name: cursor
        required: false
        schema:
          type:
          - string
          - "null"
          description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
      - description: "Os campos de cada item, separados por vírgula (13.05)."
        example: "nome,precoEmCentavos"
        in: query
        name: fields
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaProdutoResumoResponse"
          description: Uma página de produtos
          headers:
            Link:
              description: "Os links `first`, `prev` e `next` (RFC 8288). Siga-os\
                \ sem montar a URL."
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: "Lista produtos, paginando por cursor"
      tags:
      - produtos
    post:
      description: O produto nasce em `RASCUNHO`. Campos somente leitura enviados
        são ignorados. Um SKU repetido dá `409` (14.01).
      operationId: criarProduto
      parameters:
      - description: '`return=minimal` responde sem corpo.'
        example: return=minimal
        in: header
        name: Prefer
        required: false
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarProdutoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
          description: "O produto foi criado. Sem corpo com `Prefer: return=minimal`."
          headers:
            Location:
              description: A URI do produto
              schema:
                type: string
              style: simple
            Preference-Applied:
              description: "`return=minimal`, quando foi atendido"
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "409":
          $ref: "#/components/responses/Conflito"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Cadastra um produto
      tags:
      - produtos
  /v1/produtos/buscas:
    post:
      description: "Não altera nada. Para seguir os links do header `Link`, repita\
        \ o corpo."
      operationId: buscarProdutos
      parameters:
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      - description: "Itens por página. Acima de 100, vale 100."
        in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          default: 20
          description: "Itens por página. Acima de 100, vale 100."
          minimum: 1
      - description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
        in: query
        name: cursor
        required: false
        schema:
          type:
          - string
          - "null"
          description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
      - description: "Os campos de cada item, separados por vírgula."
        in: query
        name: fields
        required: false
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuscaDeProdutos"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaProdutoResumoResponse"
          description: Uma página de produtos
          headers:
            Link:
              description: "Os links `first`, `prev` e `next` (RFC 8288)."
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Busca produtos com os critérios no corpo
      tags:
      - produtos
  /v1/produtos/{id}:
    delete:
      description: O produto fica `DESCONTINUADO` e continua acessível pelo id. Repetir
        dá o mesmo `204`.
      operationId: removerProduto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: O produto foi descontinuado
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
      summary: Descontinua um produto
      tags:
      - produtos
    get:
      operationId: detalharProduto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: '`categoria` traz a categoria dentro do produto.'
        example: categoria
        in: query
        name: embed
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
          description: O produto
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
      summary: Detalha um produto
      tags:
      - produtos
    patch:
      description: JSON Merge Patch (RFC 7396) ou JSON Patch (RFC 6902). O resultado
        passa pelas mesmas validações do `PUT` (14.02). Um `test` do JSON Patch que
        falha dá `409`.
      operationId: corrigirProduto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json-patch+json:
            schema:
              type: array
              items:
                type: object
                description: "Uma operação: `op`, `path` e, conforme a operação, `value`\
                  \ ou `from`."
          application/merge-patch+json:
            schema:
              type: object
              description: Os campos a mudar; `null` remove o valor.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
          description: O produto atualizado
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Muda só alguns campos de um produto
      tags:
      - produtos
    put:
      description: "Um campo ausente vira `null` ou vazio. Para mudar só alguns campos,\
        \ use o `PATCH`."
      operationId: substituirProduto
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarProdutoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
          description: O produto atualizado
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Substitui a parte editável de um produto
      tags:
      - produtos
  /v1/produtos/{produtoId}/estoque:
    get:
      operationId: detalharEstoque
      parameters:
      - in: path
        name: produtoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstoqueResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - estoque
    put:
      operationId: definirEstoque
      parameters:
      - in: path
        name: produtoId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinirEstoqueRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstoqueResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - estoque
components:
  responses:
    Conflito:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: A requisição conflita com o estado atual do recurso
    NaoEncontrado:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: O recurso não existe
    RequisicaoInvalida:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: A requisição tem a forma ou o tipo errados
    Validacao:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: Um ou mais valores violam as regras; veja `erros`
  schemas:
    AjusteDeEstoqueEmLoteRequest:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/AjusteDoLote"
          maxItems: 500
          minItems: 0
      required:
      - itens
    AjusteDoLote:
