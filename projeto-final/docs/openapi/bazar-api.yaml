openapi: 3.1.0
info:
  contact:
    name: Equipe de plataforma do Bazar
    url: https://api.bazar.example/suporte
  description: Erros seguem o RFC 9457 (`application/problem+json`). O catálogo de
    tipos de erro está em https://api.bazar.example/problemas.
  license:
    name: Proprietária
    url: https://api.bazar.example/termos
  summary: "Catálogo, clientes e pedidos do marketplace Bazar."
  title: API do Bazar
  version: 1.0.0
servers:
- description: Este servidor
  url: /
- description: Produção
  url: https://api.bazar.example
tags:
- description: O catálogo de produtos
  name: produtos
- description: "Operações longas, executadas fora da requisição"
  name: operacoes
- description: O estoque dos produtos
  name: estoque
- description: As categorias do catálogo
  name: categorias
- description: Os pedidos
  name: pedidos
- description: Relatórios gerados fora da requisição
  name: relatorios
- description: Os clientes
  name: clientes
- description: Avisos de eventos para os sistemas dos parceiros
  name: webhooks
paths:
  /v1/ajustes-estoque/lotes:
    post:
      operationId: ajustarEstoqueEmLote
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AjusteDeEstoqueEmLoteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadoDoLote"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      summary: Define o estoque de vários produtos
      tags:
      - estoque
  /v1/assinaturas-webhook:
    post:
      operationId: criarAssinaturaWebhook
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarAssinaturaRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssinaturaResponse"
          description: "A assinatura foi criada; o corpo traz o segredo, uma única\
            \ vez"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "422":
          $ref: "#/components/responses/Validacao"
      tags:
      - webhooks
  /v1/assinaturas-webhook/{id}:
    get:
      operationId: detalharAssinaturaWebhook
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssinaturaResponse"
          description: "A assinatura, sem o segredo"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
      tags:
      - webhooks
  /v1/assinaturas-webhook/{id}/entregas:
    get:
      operationId: entregasAssinaturaWebhook
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EntregaWebhook"
          description: As 50 entregas mais recentes
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
      tags:
      - webhooks
  /v1/categorias:
    get:
      operationId: listarCategoria
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 60
          minLength: 2
      - in: query
        name: apenasRaizes
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: page
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1
      - in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          minimum: 1
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
    post:
      operationId: criarCategoria
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
  /v1/categorias/{id}:
    delete:
      operationId: removerCategoria
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
    get:
      operationId: detalharCategoria
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
    put:
      operationId: substituirCategoria
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - categorias
  /v1/clientes:
    post:
      operationId: cadastrarCliente
      parameters:
      - description: "O canal do cliente. Ausente ou desconhecido, vale `DESCONHECIDO`\
          \ (09.02)."
        in: header
        name: Bazar-Canal
        schema:
          type: string
          examples:
          - WEB
          - APP
          - PARCEIRO
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarClienteRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
          description: O cliente foi cadastrado
          headers:
            Location:
              description: A URI do cliente
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Cadastra um cliente
      tags:
      - clientes
  /v1/clientes/{clienteId}/enderecos:
    get:
      operationId: listarEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaEnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
    post:
      operationId: adicionarEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
  /v1/clientes/{clienteId}/enderecos/{enderecoId}:
    delete:
      operationId: removerEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: enderecoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
    get:
      operationId: detalharEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: enderecoId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
    put:
      operationId: substituirEndereco
      parameters:
      - in: path
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: enderecoId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnderecoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
  /v1/clientes/{id}:
    get:
      operationId: detalharCliente
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClienteResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - clientes
  /v1/operacoes/{id}:
    get:
      operationId: detalharOperacao
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacaoResponse"
          description: A operação está em andamento (com Retry-After) ou falhou (com
            erro)
          headers:
            Retry-After:
              description: Segundos até a próxima consulta
              schema:
                type: integer
              style: simple
        "303":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperacaoResponse"
          description: A operação terminou; o Location aponta o resultado
          headers:
            Location:
              description: O recurso com o resultado
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
      tags:
      - operacoes
  /v1/pedidos:
    get:
      operationId: listarPedido
      parameters:
      - in: query
        name: clienteId
        required: true
        schema:
          type: string
          format: uuid
      - description: "Itens por página. Acima de 100, vale 100."
        in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          default: 20
          description: "Itens por página. Acima de 100, vale 100."
          minimum: 1
      - description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
        in: query
        name: cursor
        required: false
        schema:
          type:
          - string
          - "null"
          description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaPedidoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - pedidos
    post:
      description: "Um cliente ou produto inexistente dá `422`; estoque insuficiente,\
        \ `409` (10.03)."
      operationId: criarPedido
      parameters:
      - description: "Uma chave única por pedido (um UUID novo), entre aspas: `\"\
          8e03978e-40d5-43e8-bc93-6894a57f9324\"`. Repetir com a mesma chave e o mesmo\
          \ corpo devolve a resposta original, com `Idempotent-Replayed: true`, sem\
          \ criar outro pedido. A chave vale por 24 horas. A mesma chave com outro\
          \ corpo dá `422`; enquanto a primeira ainda está em andamento, `409` (21.01)."
        in: header
        name: Idempotency-Key
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarPedidoRequest"
        required: true
      responses:
        "201":
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
          description: O pedido foi criado
          headers:
            Location:
              description: A URI do pedido
              schema:
                type: string
              style: simple
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "409":
          $ref: "#/components/responses/Conflito"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Cria um pedido e reserva o estoque
      tags:
      - pedidos
  /v1/pedidos/{id}:
    get:
      operationId: detalharPedido
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      tags:
      - pedidos
  /v1/pedidos/{id}/cancelamento:
    post:
      operationId: cancelarPedido
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelarPedidoRequest"
        required: true
      responses:
        "200":
          content:
            application/hal+json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/EntityModelPedidoResponse"
          description: OK
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
      summary: Cancela um pedido
      tags:
      - pedidos
  /v1/pedidos/{id}/eventos:
    get:
      description: "Cada mudança é um evento `status`, com o `id` crescente. Ao reconectar,\
        \ o cliente manda o último id recebido em `Last-Event-ID` e recebe só os seguintes.\
        \ Um pedido em estado final encerra o fluxo; a reconexão depois disso recebe\
        \ `204`."
      operationId: acompanharPedido
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      - description: "O id do último evento recebido, enviado pelo EventSource ao\
          \ reconectar."
        in: header
        name: Last-Event-ID
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: "O fluxo de eventos. O `data` de cada evento `status` é um\
            \ objeto com `pedidoId`, `numero`, `status` e `ocorridoEm`."
        "204":
          description: "O pedido está num estado final, e não há eventos novos"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
      summary: Acompanha as mudanças de status do pedido (SSE)
      tags:
      - pedidos
  /v1/produtos:
    get:
      deprecated: true
      description: "Os filtros se combinam com E; os valores de um mesmo filtro, com\
        \ OU (13.01)."
      operationId: listarProdutos
      parameters:
      - in: query
        name: q
        required: false
        schema:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 2
      - in: query
        name: sku
        required: false
        schema:
          type:
          - string
          - "null"
          pattern: "[A-Z]{3}-\\d{4}"
      - in: query
        name: categoriaId
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
            format: uuid
          maxItems: 20
          minItems: 0
      - in: query
        name: status
        required: false
        schema:
          type:
          - array
          - "null"
          items:
            type: string
            description: "Lista extensível: valores novos podem ser acrescentados,\
              \ e o cliente deve tolerar um valor que não conhece (15.04)."
            examples:
            - RASCUNHO
            - ATIVO
            - DESCONTINUADO
      - in: query
        name: precoMin
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - in: query
        name: precoMax
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
      - in: query
        name: criadoApos
        required: false
        schema:
          type:
          - string
          - "null"
          format: date-time
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      - description: "Itens por página. Acima de 100, vale 100."
        in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          default: 20
          description: "Itens por página. Acima de 100, vale 100."
          minimum: 1
      - description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
        in: query
        name: cursor
        required: false
        schema:
          type:
          - string
          - "null"
          description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
      - description: "Os campos de cada item, separados por vírgula (13.05)."
        example: "nome,precoEmCentavos"
        in: query
        name: fields
        required: false
        schema:
          type:
          - string
          - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaProdutoResumoResponse"
          description: Uma página de produtos
          headers:
            Deprecation:
              description: Desde quando a operação está depreciada (RFC 9745).
              schema:
                type: string
                example: '@1792972800'
            Link:
              description: "Os links `first`, `prev` e `next` (RFC 8288). Siga-os\
                \ sem montar a URL."
              schema:
                type: string
              style: simple
            Sunset:
              description: Quando a operação deixa de existir (RFC 8594).
              schema:
                type: string
                example: "Fri, 30 Apr 2027 00:00:00 GMT"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: "Lista produtos, paginando por cursor"
      tags:
      - produtos
      x-sunset: 2027-04-30
    post:
      deprecated: true
      description: O produto nasce em `RASCUNHO`. Campos somente leitura enviados
        são ignorados. Um SKU repetido dá `409` (14.01).
      operationId: criarProduto
      parameters:
      - description: '`return=minimal` responde sem corpo.'
        example: return=minimal
        in: header
        name: Prefer
        required: false
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarProdutoRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
          description: "O produto foi criado. Sem corpo com `Prefer: return=minimal`."
          headers:
            Deprecation:
              description: Desde quando a operação está depreciada (RFC 9745).
              schema:
                type: string
                example: '@1792972800'
            Location:
              description: A URI do produto
              schema:
                type: string
              style: simple
            Preference-Applied:
              description: "`return=minimal`, quando foi atendido"
              schema:
                type: string
              style: simple
            Sunset:
              description: Quando a operação deixa de existir (RFC 8594).
              schema:
                type: string
                example: "Fri, 30 Apr 2027 00:00:00 GMT"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "409":
          $ref: "#/components/responses/Conflito"
        "422":
          $ref: "#/components/responses/Validacao"
      summary: Cadastra um produto
      tags:
      - produtos
      x-sunset: 2027-04-30
  /v1/produtos/buscas:
    post:
      deprecated: true
      description: "Não altera nada. Para seguir os links do header `Link`, repita\
        \ o corpo."
      operationId: buscarProdutos
      parameters:
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          items:
            type: string
      - description: "Itens por página. Acima de 100, vale 100."
        in: query
        name: limit
        required: false
        schema:
          type:
          - integer
          - "null"
          format: int32
          default: 20
          description: "Itens por página. Acima de 100, vale 100."
          minimum: 1
      - description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
        in: query
        name: cursor
        required: false
        schema:
          type:
          - string
          - "null"
          description: "Opaco. Use o valor que veio no header `Link`, sem alterar."
      - description: "Os campos de cada item, separados por vírgula."
        in: query
        name: fields
        required: false
        schema:
          type:
          - string
          - "null"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuscaDeProdutos"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaProdutoResumoResponse"
          description: Uma página de produtos
          headers:
            Deprecation:
              description: Desde quando a operação está depreciada (RFC 9745).
              schema:
                type: string
                example: '@1792972800'
            Link:
