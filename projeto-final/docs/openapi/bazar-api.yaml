components:
  responses:
    Conflito:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: A requisição conflita com o estado atual do recurso
    NaoEncontrado:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: O recurso não existe
    PrecondicaoFalhou:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: "O If-Match não bate com o ETag atual: leia de novo (20.03)"
    PrecondicaoObrigatoria:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: A alteração exige o header If-Match (20.03)
    RequisicaoInvalida:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: A requisição tem a forma ou o tipo errados
    Validacao:
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problema"
      description: Um ou mais valores violam as regras; veja `erros`
  schemas:
    AjusteDeEstoqueEmLoteRequest:
      type: object
      properties:
        itens:
          type: array
          items:
            $ref: "#/components/schemas/AjusteDoLote"
          maxItems: 500
          minItems: 0
      required:
      - itens
    AjusteDoLote:
      type: object
      properties:
        produtoId:
          type: string
          format: uuid
        quantidadeDisponivel:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
      required:
      - produtoId
      - quantidadeDisponivel
    AssinaturaResponse:
      type: object
      properties:
        ativa:
          type: boolean
        criadaEm:
          type: string
          format: date-time
        desativadaEm:
          type:
          - string
          - "null"
          format: date-time
        eventos:
          type: array
          items:
            type: string
        id:
          type: string
          format: uuid
        parceiro:
          type: string
        segredo:
          type:
          - string
          - "null"
          description: "Só na criação. Guarde-o: é com ele que se verifica a assinatura\
            \ de cada entrega."
        url:
          type: string
          format: uri
      required:
      - ativa
      - criadaEm
      - desativadaEm
      - eventos
      - id
      - parceiro
      - url
    AtualizarProdutoRequest:
      type: object
      properties:
        atributos:
          type: object
          additionalProperties:
            type: string
        categoriaId:
          type: string
          format: uuid
        descricao:
          type:
          - string
          - "null"
          maxLength: 2000
          minLength: 0
        nome:
          type: string
          maxLength: 120
          minLength: 0
        precoEmCentavos:
          type: integer
          format: int64
          exclusiveMinimum: 0
      required:
      - categoriaId
      - nome
      - precoEmCentavos
    BuscaDeProdutos:
      type: object
      properties:
        atributos:
          type:
          - object
          - "null"
          additionalProperties:
            type: string
        categoriaIds:
          type:
          - array
          - "null"
          items:
            type: string
            format: uuid
          maxItems: 100
          minItems: 0
        criadoApos:
          type:
          - string
          - "null"
          format: date-time
        precoMax:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
        precoMin:
          type:
          - integer
          - "null"
          format: int64
          minimum: 0
        q:
          type:
          - string
          - "null"
          maxLength: 100
          minLength: 2
        sku:
          type:
          - string
          - "null"
          pattern: "[A-Z]{3}-\\d{4}"
        status:
          type:
          - array
          - "null"
          items:
            type: string
            description: "Lista extensível: valores novos podem ser acrescentados,\
              \ e o cliente deve tolerar um valor que não conhece (15.04)."
            examples:
            - RASCUNHO
            - ATIVO
            - DESCONTINUADO
    Cancelamento:
      type: object
      properties:
        canceladoEm:
          type: string
          format: date-time
        motivo:
          type: string
          description: "Lista extensível: valores novos podem ser acrescentados, e\
            \ o cliente deve tolerar um valor que não conhece (15.04)."
          examples:
          - CLIENTE_DESISTIU
          - ENDERECO_ERRADO
          - OUTRO
        observacao:
          type:
          - string
          - "null"
      required:
      - canceladoEm
      - motivo
      - observacao
    CancelarPedidoRequest:
      type: object
      properties:
        motivo:
          type: string
          description: "Lista extensível: valores novos podem ser acrescentados, e\
            \ o cliente deve tolerar um valor que não conhece (15.04)."
          examples:
          - CLIENTE_DESISTIU
          - ENDERECO_ERRADO
          - OUTRO
        observacao:
          type:
          - string
          - "null"
          maxLength: 500
          minLength: 0
      required:
      - motivo
    CategoriaRequest:
      type: object
      properties:
        categoriaPaiId:
          type:
          - string
          - "null"
          format: uuid
        nome:
          type: string
          maxLength: 60
          minLength: 0
        slug:
          type: string
          maxLength: 60
          minLength: 0
          pattern: "[a-z0-9]+(-[a-z0-9]+)*"
      required:
      - nome
      - slug
    CategoriaResponse:
      type: object
      properties:
        categoriaPaiId:
          type:
          - string
          - "null"
          format: uuid
        id:
          type: string
          format: uuid
        nome:
          type: string
        slug:
          type: string
      required:
      - categoriaPaiId
      - id
      - nome
      - slug
    ClienteResponse:
      type: object
      properties:
        canalDeCadastro:
          type: string
          description: "Lista extensível: valores novos podem ser acrescentados, e\
            \ o cliente deve tolerar um valor que não conhece (15.04)."
          examples:
          - WEB
          - APP
          - PARCEIRO
          - DESCONHECIDO
        criadoEm:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: string
          format: uuid
        nome:
          type: string
        telefone:
          type:
          - string
          - "null"
      required:
      - canalDeCadastro
      - criadoEm
      - email
      - id
      - nome
      - telefone
    CriarAssinaturaRequest:
      type: object
      properties:
        eventos:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        parceiro:
          type: string
          maxLength: 100
          minLength: 0
        url:
          type: string
          format: uri
      required:
      - eventos
      - parceiro
      - url
    CriarClienteRequest:
      type: object
      properties:
        cpf:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        nome:
          type: string
          maxLength: 120
          minLength: 0
        telefone:
          type:
          - string
          - "null"
          pattern: "\\+\\d{10,13}"
      required:
      - cpf
      - email
      - nome
    CriarPedidoRequest:
      type: object
      properties:
        clienteId:
          type: string
          format: uuid
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ItemDoNovoPedido"
          maxItems: 50
          minItems: 0
      required:
      - clienteId
      - itens
    CriarProdutoRequest:
      type: object
      properties:
        atributos:
          type: object
          additionalProperties:
            type: string
        categoriaId:
          type: string
          format: uuid
        descricao:
          type:
          - string
          - "null"
          maxLength: 2000
          minLength: 0
        nome:
          type: string
          maxLength: 120
          minLength: 0
        precoEmCentavos:
          type: integer
          format: int64
          exclusiveMinimum: 0
        sku:
          type: string
          minLength: 1
          pattern: "[A-Z]{3}-\\d{4}"
      required:
      - categoriaId
      - nome
      - precoEmCentavos
      - sku
    DefinirEstoqueRequest:
      type: object
      properties:
        quantidadeDisponivel:
          type: integer
          format: int32
          maximum: 1000000
          minimum: 0
        versao:
          type:
          - integer
          - "null"
          format: int64
          deprecated: true
          description: Use o header If-Match com o ETag do GET.
      required:
      - quantidadeDisponivel
    Dinheiro:
      type: object
      description: "Um valor monetário exato, com a moeda (15.02)."
      properties:
        moeda:
          type: string
          description: Código ISO 4217
          examples:
          - BRL
          pattern: "^[A-Z]{3}$"
        valor:
          type: string
          description: "Decimal em texto, com as casas da moeda"
          examples:
          - "129.90"
          pattern: ^-?\d+(\.\d+)?$
      required:
      - moeda
      - valor
    EnderecoRequest:
      type: object
      properties:
        cep:
          type: string
          minLength: 1
          pattern: "\\d{8}"
        cidade:
          type: string
          maxLength: 60
          minLength: 0
        complemento:
          type:
          - string
          - "null"
          maxLength: 60
          minLength: 0
        logradouro:
          type: string
          maxLength: 120
          minLength: 0
        numero:
          type: string
          maxLength: 10
          minLength: 0
        principal:
          type:
          - boolean
          - "null"
        uf:
          type: string
          minLength: 1
          pattern: "[A-Z]{2}"
      required:
      - cep
      - cidade
      - logradouro
      - numero
      - uf
    EnderecoResponse:
      type: object
      properties:
        cep:
          type: string
        cidade:
          type: string
        complemento:
          type:
          - string
          - "null"
        criadoEm:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        logradouro:
          type: string
        numero:
          type: string
        principal:
          type: boolean
        uf:
          type: string
      required:
      - cep
      - cidade
      - complemento
      - criadoEm
      - id
      - logradouro
      - numero
      - principal
      - uf
    EntityModelPedidoResponse:
      type: object
      properties:
        _links:
          $ref: "#/components/schemas/Links"
        cancelamento:
          oneOf:
          - $ref: "#/components/schemas/Cancelamento"
          - type: "null"
        clienteId:
          type: string
          format: uuid
        criadoEm:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ItemDoPedido"
        numero:
          type: string
        status:
          type: string
          description: "Lista extensível: valores novos podem ser acrescentados, e\
            \ o cliente deve tolerar um valor que não conhece (15.04)."
          examples:
          - CRIADO
          - PAGAMENTO_PENDENTE
          - PAGO
          - ENVIADO
          - ENTREGUE
          - CANCELADO
          - REEMBOLSADO
        valorFrete:
          $ref: "#/components/schemas/Dinheiro"
        valorItens:
          $ref: "#/components/schemas/Dinheiro"
        valorTotal:
          $ref: "#/components/schemas/Dinheiro"
      required:
      - cancelamento
      - clienteId
      - criadoEm
      - id
      - itens
