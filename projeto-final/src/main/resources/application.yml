spring:
  application:
    name: bazar
  threads:
    virtual:
      # Uma virtual thread por requisição no Tomcat, e virtual threads no @Async, no agendador e no cliente HTTP do
      # JDK (19.02). O server.tomcat.threads.* deixa de valer: o limite passa a ser os pools das dependências.
      enabled: true
  main:
    # Virtual threads são daemon: sem isto, uma aplicação que só tivesse tarefas agendadas terminaria sozinha.
    keep-alive: true
  jackson:
    mapper:
      # A ordem dos campos no JSON segue a declaração (records e classes), não o alfabeto.
      sort-properties-alphabetically: false
  messages:
    # Idioma sem tradução usa o arquivo base (inglês), e não o idioma do servidor.
    fallback-to-system-locale: false
  data:
    web:
      pageable:
        # Um Page devolvido por engano sai como PagedModel ({content, page}), e não com os campos internos do
        # PageImpl. O Bazar não devolve Page: as listagens paginadas usam Pagina (itens + pagina), 13.03.
        serialization-mode: via-dto
  jpa:
    # Sem Open Session in View: nenhuma consulta escondida acontece depois do controller (10.01).
    open-in-view: false
    hibernate:
      # O esquema é do Flyway (src/main/resources/db/migration); o Hibernate só confere se as entidades batem.
      ddl-auto: validate

server:
  port: 8080

# O contrato OpenAPI gerado a partir do código (17.02): /v3/api-docs e /swagger-ui.html.
springdoc:
  # Só a API pública: o /error do Spring e as páginas HTML de /problemas não entram no contrato. O filtro vale para o
  # caminho do mapeamento, antes de o springdoc trocar /v{versao} por /v1 ou /v2 (18.03).
  paths-to-match: /v*/**
  # Sem isso, as respostas aparecem como */*: o springdoc não sabe o que o conversor de mensagens vai escolher.
  default-produces-media-type: application/json
  # Os @ModelAttribute (FiltroProduto, JanelaPedida) viram um parâmetro de query por campo, como chegam de verdade.
  default-flat-param-object: true
  # Chaves em ordem alfabética: o contrato exportado (docs/openapi) muda só quando a API muda.
  writer-with-order-by-keys: true
  model-converters:
    # Campos com @Nullable (JSpecify) aceitam null no contrato: type: [string, "null"].
    java-nullable-property-customizer:
      enabled: true
  api-docs:
    # Em produção, o contrato é publicado no portal a partir do arquivo versionado (17.05), e não pela aplicação.
    enabled: ${BAZAR_CONTRATO_NA_APLICACAO:true}
  swagger-ui:
    enabled: ${BAZAR_CONTRATO_NA_APLICACAO:true}
    # A ordem do contrato, e não a alfabética.
    operations-sorter: method
