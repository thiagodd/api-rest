# Mensagens da API (title e detail dos Problem Details). Arquivo base: inglês.
# Chaves do Bazar: problemDetail.title.<tipo> e problemDetail.<tipo>, em que <tipo> é o final da URI do type.
problemDetail.title.validacao=Invalid data
problemDetail.validacao={0,choice,1#The request has 1 invalid field.|1<The request has {0} invalid fields.}
problemDetail.title.produto-nao-encontrado=Product not found
problemDetail.produto-nao-encontrado=There is no product with id {0}.
problemDetail.title.categoria-nao-encontrada=Category not found
problemDetail.categoria-nao-encontrada=There is no category with id {0}.
problemDetail.title.cliente-nao-encontrado=Customer not found
problemDetail.cliente-nao-encontrado=There is no customer with id {0}.
problemDetail.title.categoria-com-produtos=The category has products
problemDetail.categoria-com-produtos=The category "{0}" has {1} product(s). Move or discontinue them before removing it.
problemDetail.title.categoria-com-subcategorias=The category has subcategories
problemDetail.categoria-com-subcategorias=The category "{0}" has {1} subcategory(ies). Move or remove them before removing it.
problemDetail.title.pedido-nao-encontrado=Order not found
problemDetail.pedido-nao-encontrado=There is no order with id {0}.
problemDetail.title.estoque-insuficiente=Insufficient stock
problemDetail.estoque-insuficiente=Product {0} has {1} unit(s) available; {2} were requested.
problemDetail.erro-inesperado=Unexpected error. If it persists, contact support with the traceId.

# Exceções do Spring: problemDetail.title.<classe> e problemDetail.<classe> (convenção do Spring Framework).
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Unreadable request
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=The request body is not valid JSON or has a value of the wrong type.
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Invalid request
# O título usa a classe concreta; o detail, a genérica (TypeMismatchException). Só o nome ({0}) entra; o valor ({1}) não é ecoado.
problemDetail.org.springframework.beans.TypeMismatchException=The value of parameter ''{0}'' is invalid.

