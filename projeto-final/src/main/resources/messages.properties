# 16.01: the problem catalog page and what the client should do with each type.
problema.catalogo.titulo=Bazar problem catalog
problema.catalogo.acao=What the client should do
problema.acao.CORRIGIR_A_REQUISICAO=Fix the request. Sending the same request again gives the same error.
problema.acao.MOSTRAR_AO_USUARIO=Show it to the user: it is a business situation, and they decide the next step.
problema.acao.RELER_E_REPETIR=Fetch the current state of the resource, reapply the change and send it again.
problema.acao.AGUARDAR_E_REPETIR=Retry after a while, with backoff, if the operation is idempotent.
