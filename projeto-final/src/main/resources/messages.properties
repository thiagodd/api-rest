# Exceções do Spring: problemDetail.title.<classe> e problemDetail.<classe> (convenção do Spring Framework).
problemDetail.title.org.springframework.http.converter.HttpMessageNotReadableException=Unreadable request
problemDetail.org.springframework.http.converter.HttpMessageNotReadableException=The request body is not valid JSON or has a value of the wrong type.
problemDetail.title.org.springframework.web.method.annotation.MethodArgumentTypeMismatchException=Invalid request
# O título usa a classe concreta; o detail, a genérica (TypeMismatchException). Só o nome ({0}) entra; o valor ({1}) não é ecoado.
problemDetail.org.springframework.beans.TypeMismatchException=The value of parameter ''{0}'' is invalid.

