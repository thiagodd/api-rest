<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="APIs REST do básico ao avançado com Spring Boot, em português." />
    <title>APIs REST com Spring Boot</title>
    <script>
      // Aplica o tema antes da renderização para evitar o "flash" de tema errado
      try {
        var t = localStorage.getItem('bazar-docs:tema')
        var escuro = t === 'escuro' || ((!t || t === 'sistema') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', escuro)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
